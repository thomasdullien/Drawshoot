<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Drawshoot - Touch Shooter Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
        font-family: Arial, sans-serif;
        touch-action: none;
      }

      #app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #gameCanvas {
        display: block;
        background-color: #000033;
        border: 2px solid #00FFFF;
        touch-action: none;
        max-width: 100vw;
        max-height: calc(100vh - 60px);
      }

      #controls {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        z-index: 10;
      }

      .button {
        padding: 10px 20px;
        background-color: #00FFFF;
        color: #000;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        font-size: 14px;
        cursor: pointer;
        touch-action: manipulation;
        transition: background-color 0.2s;
      }

      .button:active {
        background-color: #00AAAA;
      }

      .button:disabled {
        background-color: #666;
        color: #AAA;
        cursor: not-allowed;
      }

      #editorMode {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.95);
        z-index: 100;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      #editorMode.active {
        display: flex;
      }

      #editorCanvas {
        background-color: #FFF;
        border: 3px solid #00FFFF;
        touch-action: none;
        cursor: crosshair;
      }

      #editorControls {
        margin-top: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        align-items: center;
      }

      #shapeSelector {
        display: flex;
        gap: 5px;
      }

      .shape-button {
        padding: 8px 12px;
        background-color: #444;
        color: #FFF;
        border: 2px solid #666;
        border-radius: 5px;
        cursor: pointer;
        font-size: 12px;
      }

      .shape-button.selected {
        background-color: #00FFFF;
        color: #000;
        border-color: #00FFFF;
      }

      #colorPicker {
        padding: 5px;
        border: 2px solid #00FFFF;
        border-radius: 5px;
        background-color: #222;
        cursor: pointer;
      }

      #brushSize {
        width: 100px;
      }

      .editor-label {
        color: #FFF;
        font-size: 14px;
        font-weight: bold;
      }

      #loadingScreen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000033;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        color: #FFF;
      }

      #loadingScreen.hidden {
        display: none;
      }

      #loadingText {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 20px;
        color: #00FFFF;
      }

      .loading-spinner {
        border: 4px solid #333;
        border-top: 4px solid #00FFFF;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 768px) {
        .button {
          padding: 12px 18px;
          font-size: 16px;
        }

        #controls {
          top: 5px;
        }
      }
    </style>
  </head>
  <body>
    <div id="loadingScreen">
      <div id="loadingText">Loading...</div>
      <div class="loading-spinner"></div>
    </div>

    <div id="app">
      <div id="controls">
        <button id="editButton" class="button">Edit Sprites</button>
        <button id="pauseButton" class="button">Pause</button>
        <button id="restartButton" class="button">Restart</button>
      </div>

      <canvas id="gameCanvas"></canvas>

      <!-- Editor Mode -->
      <div id="editorMode">
        <h2 style="color: #00FFFF; margin-bottom: 20px;">Sprite Editor</h2>

        <canvas id="editorCanvas" width="400" height="400"></canvas>

        <div id="editorControls">
          <div>
            <label class="editor-label" for="shapeSelector">Shape:</label>
            <div id="shapeSelector">
              <button class="shape-button" data-shape="4">Square</button>
              <button class="shape-button" data-shape="5">Pentagon</button>
              <button class="shape-button" data-shape="6">Hexagon</button>
              <button class="shape-button" data-shape="7">Heptagon</button>
              <button class="shape-button" data-shape="8">Octagon</button>
            </div>
          </div>

          <div>
            <label class="editor-label" for="colorPicker">Color:</label>
            <input type="color" id="colorPicker" value="#FF0000" />
          </div>

          <div>
            <label class="editor-label" for="brushSize">Brush Size:</label>
            <input type="range" id="brushSize" min="5" max="50" value="20" />
            <span id="brushSizeValue" class="editor-label">20</span>
          </div>

          <button id="clearCanvas" class="button">Clear</button>
          <button id="resetSprite" class="button">Reset to Default</button>
          <button id="saveSprite" class="button">Save & Close</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
